#
# XcodeGen 工程描述。
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate && open CoomiIOS.xcodeproj
#
# ============ 架构 ============
#
#   安卓：原生 Rust 引擎（libcoomi_engine.so，JNI）+ proot 工作环境
#   iOS ：原生 Rust 引擎（libcoomi_ui.a，C ABI）+ iSH  工作环境
#
# 左右两半**互相独立**：
#   · 引擎编成 aarch64-apple-ios 静态库，链进 App，在本进程内起 tokio + axum。
#     原生指令集，零模拟。
#   · iSH 只负责「给 AI 一个能执行 shell 命令的 Linux」，等价于安卓的 proot。
#     它起不来时引擎照常工作，只是 shell 工具不可用。
#
# 早期版本把引擎编成 i686 Linux ELF 塞进 iSH 里执行 —— 那是错的：
# 多一层指令模拟、启动慢、还不能用原生网络栈。已废弃。
#
# ============ 两种构建模式 ============
#
#   ① 未集成 iSH：COOMI_HAS_ISH=0，ish_support.c 走桩实现。
#      App 能编译能跑，对话/记忆/联网全正常，只是 AI 不能执行 shell 命令。
#   ② 已集成 iSH（**当前默认**）：COOMI_HAS_ISH=1 + 链接 libIshKernel。
#      AI 可以在 App 内执行 Linux 命令（sh/git/python 等）。
#
# 现在走 ②。iSH 以 xcframework 形式引入：
#   ThirdParty/ish/libIshKernel.xcframework（含 ios-arm64 与模拟器两个 slice）
# 来源 https://github.com/Lolendor/ish-arm64-pkg v0.3.3，
# checksum f747c2e8...4fca，脚本 scripts/fetch-ish.sh 负责下载。
#
# 若该 xcframework 不存在，下面的 optional: true 会让工程仍能生成，
# 但 COOMI_HAS_ISH=1 会因缺 ishembed.h 而编译失败 —— 这是有意的：
# 半集成状态（声明有 iSH 却没有库）比彻底没有更难排查。
#
# 引擎库是**必需**的（与 COOMI_HAS_ISH 无关）：缺 libcoomi_ui.a 会链接失败，
# 这是有意的 —— 没有引擎的 App 没有任何意义，应该在构建期就报错而不是运行期降级。
name: CoomiIOS
options:
  bundleIdPrefix: app.coomi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # 已集成 iSH：真实现生效。
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "COOMI_HAS_ISH=1"
    # 静态库只保留 arm64（真机）。模拟器要单独编 x86_64，CI 不产出。
    ONLY_ACTIVE_ARCH: NO

targets:
  CoomiIOS:
    type: application
    platform: iOS
    sources:
      - path: CoomiApp/Sources
      # 前端产物用**文件夹引用**（type: folder）保留 web/ 层级：
      # 引擎的 ServeDir 指向 home/web，需要这一层目录；默认展开会把
      # Resources/web/* 平铺到 .app 根部（index.html 与二进制混在一起）。
      - path: CoomiApp/Resources/web
        optional: true
        type: folder
        buildPhase: resources
      # 其它单体资源（如 linux-rootfs.tar.gz）仍按普通资源处理。
      - path: CoomiApp/Resources
        optional: true
        buildPhase: resources
        excludes:
          - "web/**"
          # README.md 是给人看的说明，不该占 App 包体积。
          - "README.md"
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coomi.ios
        MARKETING_VERSION: "1.6.8"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Coomi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        # ish_support.c 里 `#include "ishembed.h"`，头在 xcframework 的
        # Headers/ 下，XcodeGen 会把 framework 的头路径自动带上；
        # 显式再写一份，避免换 XcodeGen 版本后头文件找不到。
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/engine"
          - "$(SRCROOT)/ThirdParty/ish/libIshKernel.xcframework/ios-arm64/Headers"

        # ---- 链接（引擎必需 + iSH 必需）----
        # 引擎由 CI 的 engine job 产出：cargo build -p coomi-ui --target
        # aarch64-apple-ios --release，导出 coomi_start/coomi_port/coomi_version。
        # iSH 走 -lIshKernel，库文件来自 xcframework 的 ios-arm64 slice。
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lcoomi_ui"
          - "-lIshKernel"
          # 引擎依赖的系统框架：tokio 的网络/时间、安全框架的随机数。
          - "-lc++"
          - "-framework Security"
          - "-framework SystemConfiguration"
          # iSH 的 fakefs 用 sqlite3 存元数据，这是它唯一的额外依赖。
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/engine"
          # 注意要指到 xcframework 的 slice 里面，不是 ThirdParty/ish 本身。
          # 库文件实际在 libIshKernel.xcframework/ios-arm64/libIshKernel.a，
          # 只写 ThirdParty/ish 的话链接期会报 `ld: library 'IshKernel' not found`
          # —— 编译阶段（ish_support.c 的 #include）是过的，所以只看编译日志
          # 会以为一切正常，直到 Ld 阶段才炸。
          - "$(SRCROOT)/ThirdParty/ish/libIshKernel.xcframework/ios-arm64"
    info:
      path: CoomiApp/Info.plist
      properties:
        CFBundleDisplayName: Coomi
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 引擎监听 127.0.0.1，iOS 默认禁止明文 http —— 必须开例外。
        # 只放行本机回环，不放开任意域名。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # **不声明 ish scheme**：早期方案靠 `ish://run?cmd=` 拉起外部 iSH App，
        # 但 iOS 会把后台进程挂起 → 引擎停摆。现在同进程内运行，无需跨 App 跳转。
    dependencies: []
