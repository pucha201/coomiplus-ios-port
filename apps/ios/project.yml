#
# XcodeGen 工程描述。
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate && open CoomiIOS.xcodeproj
#
# 架构：**引擎跑在 App 自己进程内**（内嵌 iSH Linux 内核），
# 不依赖外部 iSH App —— 因此没有「切到前台 iSH 被 iOS 挂起」的问题。
#
# 两种构建模式：
#   ① 未集成 iSH（默认）：COOMI_HAS_ISH=0，用 ish_support.c 的桩实现。
#      App 能编译、能跑 UI，点启动会明确提示「未链接 iSH 运行时」。
#   ② 已集成 iSH：把 iSH 编成静态库后，打开 COOMI_HAS_ISH=1 并链接 libish.a。
#      见 docs/README.md「集成 iSH 静态库」。
name: CoomiIOS
options:
  bundleIdPrefix: app.coomi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # 默认不集成 iSH；集成后改成 1（或在 xcconfig 里覆盖）。
    GCC_PREPROCESSOR_DEFINITIONS:
      - "$(inherited)"
      - "COOMI_HAS_ISH=0"

targets:
  CoomiIOS:
    type: application
    platform: iOS
    sources:
      - path: CoomiApp/Sources
      # 资源必须显式指定 buildPhase: resources。
      # 只写 path 时 XcodeGen 归到 sources 阶段，
      # 无扩展名的 `coomi`（i686 ELF）和 `web/` 目录都不会进 bundle ——
      # 实测 IPA 里只有裸二进制、没有前端与引擎。
      - path: CoomiApp/Resources
        buildPhase: resources
        optional: true
      # 注意：**不再**把 i686 的 `coomi` 打进 App。
      # 引擎现在编译为原生 aarch64 静态库（libcoomi_ui.a），直接链接进主二进制。
      # 早期版本把 i686 ELF 塞进 bundle 由 iSH 模拟执行 —— 多 22MB、性能只剩 10-20%。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coomi.ios
        MARKETING_VERSION: "1.6.8"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Coomi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iSH 内核是 C，需要 C99 与这几个头搜索路径（集成后由 ish.xcconfig 提供）。
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/ish"
        # 原生 Rust 引擎（CI 里由 cargo build --target aarch64-apple-ios 产出）。
        # 链接后 Swift 可直接调 coomi_start / coomi_port / coomi_version。
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lcoomi_ui"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/ThirdParty/engine"
        # iSH 静态库（工作环境用，可选）：集成后取消注释。
        # - "-lish"
        # - "$(SRCROOT)/ThirdParty/ish/build"
    info:
      path: CoomiApp/Info.plist
      properties:
        CFBundleDisplayName: Coomi
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 允许明文 http 到 127.0.0.1（iOS 默认禁止）。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # 注意：**不再声明 ish scheme**。
        # 早期方案靠 `ish://run?cmd=` 拉起外部 iSH App，但 iOS 会把后台的 iSH 挂起
        # → 引擎停摆。现在引擎在本进程内运行，不需要跨 App 跳转。
    dependencies: []
