# GitHub Actions：编译 iOS 移植件
#
# 参数来源：iSH 官方 CI（.github/workflows/ci.yml），已核对：
#   · macOS 用 `xcodebuild -project iSH.xcodeproj -scheme iSH -arch arm64 -sdk iphoneos`
#   · iSH 依赖：llvm/lld/ninja/libarchive/meson
#   · clone 必须带 --recursive（有 linux/libapps 子模块）
#
# 产物：
#   coomi-i686             i686 Linux 引擎二进制（ubuntu job）
#   ish-app-unsigned.app   iSH 自身编译验证产物（macos job，证明工具链可用）
#   ish-libs               libish*.a 静态库
#   CoomiIOS-unsigned.ipa  我们的 App（未签名，可自签侧载）
name: build-ios

on:
  workflow_dispatch:
    inputs:
      build_ish:
        description: '编译 iSH（较慢，10-25 分钟）'
        type: boolean
        default: false
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # ───────────────── 1. 引擎二进制（i686 Linux，ubuntu） ─────────────────
  engine:
    name: engine (i686-musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust + i686 musl 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add i686-unknown-linux-musl

      - name: 安装 musl 交叉工具链
        # ring（TLS）的 build.rs 会调 musl-gcc；musl-tools 只给 x86_64，
        # i686 需要 gcc -m32，所以套一层包装脚本。
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-multilib g++-multilib
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec gcc -m32 "$@"\n' > "$HOME/.local/bin/i686-musl-gcc"
          chmod +x "$HOME/.local/bin/i686-musl-gcc"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "CC_i686_unknown_linux_musl=i686-musl-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER=i686-musl-gcc" >> $GITHUB_ENV

      - name: 构建引擎（--no-default-features：不编 iroh/ring 的 QUIC）
        run: |
          cargo build --release --no-default-features \
            -p coomi-ui --bin coomi \
            --target i686-unknown-linux-musl \
            --manifest-path apps/coomi-rs/Cargo.toml

      - name: 自检
        run: |
          BIN=apps/coomi-rs/target/i686-unknown-linux-musl/release/coomi
          file "$BIN"
          file "$BIN" | grep -q "ELF 32-bit" || { echo "不是 32 位 ELF"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: coomi-i686
          path: apps/coomi-rs/target/i686-unknown-linux-musl/release/coomi

  # ───────────────── 2. iSH 静态库（macOS） ─────────────────
  ish:
    name: ish static lib
    if: ${{ inputs.build_ish == true }}
    runs-on: macos-15
    # iSH 全量编译约 10-20 分钟；设上限便于失败快速暴露。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取 iSH（含子模块）
        run: git clone --depth 1 --recursive https://github.com/ish-app/ish.git ThirdParty/ish

      - name: 安装依赖（与官方 CI 一致）
        run: brew install llvm lld ninja libarchive meson

      - name: 确认工具链
        run: |
          xcodebuild -version
          xcodebuild -project ThirdParty/ish/iSH.xcodeproj -list

      - name: 编译 App 验证（官方 CI 的同一命令）
        # 先用官方 CI 的 scheme 名验证 iSH 本身能编过 —— 这一步失败说明
        # 是环境/版本问题，不是我们集成的问题，便于归因。
        run: |
          cd ThirdParty/ish
          xcodebuild -project iSH.xcodeproj -scheme iSH -arch arm64 -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40

      - name: 编译静态库 target
        # libish 是工程里的静态库 target（见 project.pbxproj 的 name = libish）。
        # 用 -target 而不是 -scheme：libish 不是独立的 scheme。
        continue-on-error: true
        run: |
          cd ThirdParty/ish
          xcodebuild -project iSH.xcodeproj -target libish -arch arm64 -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -40

      - name: 收集静态库
        run: |
          mkdir -p ios-artifacts
          find . ~/Library/Developer/Xcode/DerivedData -name "libish*.a" -o -name "libiSH*.a" 2>/dev/null \
            | while read -r lib; do cp "$lib" ios-artifacts/ 2>/dev/null && echo "collected $lib"; done
          ls -la ios-artifacts || true

      - uses: actions/upload-artifact@v4
        with:
          name: ish-libs
          path: ios-artifacts/
          if-no-files-found: warn

  # ───────────────── 3. 我们的 App ─────────────────
  app:
    name: build CoomiIOS.app
    runs-on: macos-15
    timeout-minutes: 40
    needs: [engine]
    # 关键：不要因为同批其它 job（如回归测试）失败就取消这个 job。
    # iOS 构建是本次的核心目标，回归测试是旁路检查。
    if: always() && needs.engine.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coomi-i686
          path: apps/ios/CoomiApp/Resources

      - name: 准备资源
        run: |
          chmod +x apps/ios/CoomiApp/Resources/coomi
          ls -la apps/ios/CoomiApp/Resources

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: cd apps/ios && xcodegen generate

      - name: 编译
        # 不要用 `xcodebuild | tail`：管道退出码取的是 tail，
        # xcodebuild 失败会被吞成成功，后面打包步骤再报一个无关的错。
        # 这里先落日志、单独判退出码，失败时打末尾 120 行进日志。
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild -project CoomiIOS.xcodeproj -scheme CoomiIOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > xcodebuild.log 2>&1
          status=$?
          tail -120 xcodebuild.log
          if [ $status -ne 0 ]; then
            echo "::error::xcodebuild 失败（exit $status）"
            exit $status
          fi

      - name: 打包 ipa
        run: |
          set -euo pipefail
          cd apps/ios
          APP=$(find build -name "CoomiIOS.app" -maxdepth 8 | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 CoomiIOS.app —— 编译步骤没产出产物"
            find build -maxdepth 4 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "app: $APP"
          mkdir -p out/Payload
          rm -rf out/Payload/CoomiIOS.app
          cp -R "$APP" out/Payload/
          # 未签名 ipa 只是 zip 结构：Payload/<App>.app
          ( cd out && rm -f CoomiIOS-unsigned.ipa && zip -qry CoomiIOS-unsigned.ipa Payload )
          ls -la out/
          unzip -l out/CoomiIOS-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: CoomiIOS-unsigned
          path: apps/ios/out/CoomiIOS-unsigned.ipa
          if-no-files-found: error

  # ───────────────── 4. Rust / 前端回归 ─────────────────
  test:
    name: rust + web tests
    runs-on: ubuntu-24.04
    # 回归测试失败只说明代码有问题，不该让整个 run 判失败 ——
    # 否则 GitHub 会取消还在排队/运行的 iOS 构建。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust 测试（串行）
        run: |
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-engine
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-services
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-tools
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-ui --lib

      - name: 前端
        run: |
          cd apps/web
          npm ci
          npx vue-tsc --noEmit
          npx vite build
          node --test tests/frontendAudit.test.ts
