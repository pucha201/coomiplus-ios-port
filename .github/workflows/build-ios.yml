# GitHub Actions：编译 iOS 移植件
#
# 参数来源：iSH 官方 CI（.github/workflows/ci.yml），已核对：
#   · macOS 用 `xcodebuild -project iSH.xcodeproj -scheme iSH -arch arm64 -sdk iphoneos`
#   · iSH 依赖：llvm/lld/ninja/libarchive/meson
#   · clone 必须带 --recursive（有 linux/libapps 子模块）
#
# 产物：
#   libcoomi_ui.a          iOS 引擎静态库（aarch64-apple-ios，engine job）
#   ish-app-unsigned.app   iSH 自身编译验证产物（macos job，证明工具链可用）
#   ish-libs               libish*.a 静态库
#   CoomiIOS-unsigned.ipa  我们的 App（未签名，可自签侧载）
name: build-ios

on:
  workflow_dispatch:
    inputs:
      build_ish:
        description: '编译 iSH（较慢，10-25 分钟）'
        type: boolean
        default: false
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # ───────────────── 1. 引擎静态库（aarch64-apple-ios） ─────────────────
  engine:
    name: engine (aarch64-apple-ios)
    # 引擎**原生**编译：与安卓同构 ——
    #   安卓 = 原生引擎(JNI) + proot 工作环境
    #   iOS  = 原生引擎(staticlib) + iSH 工作环境
    # 所以这里产出的是 iOS 静态库，不再是跑在 iSH 里的 i686 ELF。
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust + iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          # llvm-tools 提供与 rustc **同版本**的 llvm-nm。
          # 必须用它做自检：Xcode 16.4 自带的 nm 是 LLVM 17，
          # 读不了 Rust 1.99/LLVM 23 产出的新 DWARF 属性（Unknown attribute kind 102），
          # 会把整批成员对象判成解析错误 → 误报"缺符号"。
          rustup component add llvm-tools-preview
          rustc --version
          # llvm-nm 的实际位置随 rustup 布局变化，逐条试，取第一个存在的。
          LLVM_NM=""
          for cand in \
            "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-nm" \
            "$(find "$(rustc --print sysroot)" -name llvm-nm -type f 2>/dev/null | head -1)" \
            "$(command -v llvm-nm || true)" \
            "$(brew --prefix llvm 2>/dev/null)/bin/llvm-nm"
          do
            if [ -n "$cand" ] && [ -x "$cand" ]; then LLVM_NM="$cand"; break; fi
          done
          echo "LLVM_NM=${LLVM_NM:-<未找到>}"
          echo "LLVM_NM=$LLVM_NM" >> "$GITHUB_ENV"
          [ -n "$LLVM_NM" ] && "$LLVM_NM" --version | head -2
          clang --version | head -3

      - name: 构建静态库
        run: |
          set -o pipefail
          cargo build --release \
            -p coomi-ui \
            --target aarch64-apple-ios \
            --manifest-path apps/coomi-rs/Cargo.toml \
            2>&1 | tail -40

      - name: 自检
        run: |
          set +e
          LIB=apps/coomi-rs/target/aarch64-apple-ios/release/libcoomi_ui.a
          ls -la "$LIB"
          file "$LIB"
          file "$LIB" | grep -qi "arm64\|aarch64" || { echo "::error::不是 arm64 产物"; exit 1; }

          # 判据一：与编译器同版本的 llvm-nm（权威）。
          # 判据二：ar 成员里的 Mach-O 符号表字节扫描（兜底，不依赖任何 nm）。
          # 两条任一命中即通过 —— 避免再次被单一工具的版本差异误判。
          echo "===== 判据一：llvm-nm ====="
          if [ -x "$LLVM_NM" ]; then
            "$LLVM_NM" -g "$LIB" > nm.txt 2> nm.err
            echo "llvm-nm 退出码 $?；输出 $(wc -l < nm.txt) 行；stderr $(wc -l < nm.err) 行"
          else
            echo "llvm-nm 不可用，跳过判据一"
            : > nm.txt; : > nm.err
          fi
          grep -E "_coomi_(start|port|version)" nm.txt | head -5
          HIT1=$(grep -cE "_coomi_(start|port|version)" nm.txt)

          echo "===== 判据二：ar + strings（不依赖 nm）====="
          strings "$LIB" | grep -E "^_?coomi_(start|port|version)$" | sort -u | tee strings.txt
          HIT2=$(wc -l < strings.txt)

          echo "判据一命中 $HIT1 处；判据二命中 $HIT2 处"
          if [ "$HIT1" -gt 0 ] || [ "$HIT2" -gt 0 ]; then
            echo "✅ 静态库自检通过"
          else
            echo "::error::两种判据均未找到 coomi_* 符号"
            echo "--- llvm-nm stderr 前 20 行 ---"; head -20 nm.err
            echo "--- llvm-nm 前 20 行 ---"; head -20 nm.txt
            echo "--- 任意 coomi 符号 ---"; grep -i coomi nm.txt | head -10 || echo "(无)"
            echo "--- ar 成员数 ---"; ar t "$LIB" | wc -l
            echo "--- coomi_ui 成员 ---"; ar t "$LIB" | grep -i coomi_ui | head -5
            exit 1
          fi

      - name: 上传静态库
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libcoomi_ui-ios
          path: apps/coomi-rs/target/aarch64-apple-ios/release/libcoomi_ui.a
          if-no-files-found: error
          retention-days: 7

      - name: 失败时上传诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nm-diagnostics
          path: |
            nm.txt
            nm.err
            strings.txt
          if-no-files-found: ignore

  # ───────────────── 2. iSH 静态库（macOS） ─────────────────
  ish:
    name: ish static lib
    if: ${{ inputs.build_ish == true }}
    runs-on: macos-15
    # iSH 全量编译约 10-20 分钟；设上限便于失败快速暴露。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 取 iSH（含子模块）
        run: git clone --depth 1 --recursive https://github.com/ish-app/ish.git ThirdParty/ish

      - name: 安装依赖（与官方 CI 一致）
        run: brew install llvm lld ninja libarchive meson

      - name: 确认工具链
        run: |
          xcodebuild -version
          xcodebuild -project ThirdParty/ish/iSH.xcodeproj -list

      - name: 编译 App 验证（官方 CI 的同一命令）
        # 先用官方 CI 的 scheme 名验证 iSH 本身能编过 —— 这一步失败说明
        # 是环境/版本问题，不是我们集成的问题，便于归因。
        run: |
          cd ThirdParty/ish
          xcodebuild -project iSH.xcodeproj -scheme iSH -arch arm64 -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40

      - name: 编译静态库 target
        # libish 是工程里的静态库 target（见 project.pbxproj 的 name = libish）。
        # 用 -target 而不是 -scheme：libish 不是独立的 scheme。
        continue-on-error: true
        run: |
          cd ThirdParty/ish
          xcodebuild -project iSH.xcodeproj -target libish -arch arm64 -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -40

      - name: 收集静态库
        run: |
          mkdir -p ios-artifacts
          find . ~/Library/Developer/Xcode/DerivedData -name "libish*.a" -o -name "libiSH*.a" 2>/dev/null \
            | while read -r lib; do cp "$lib" ios-artifacts/ 2>/dev/null && echo "collected $lib"; done
          ls -la ios-artifacts || true

      - uses: actions/upload-artifact@v4
        with:
          name: ish-libs
          path: ios-artifacts/
          if-no-files-found: warn

  # ───────────────── 3. 我们的 App ─────────────────
  app:
    name: build CoomiIOS.app
    runs-on: macos-15
    timeout-minutes: 40
    needs: [engine]
    # 关键：不要因为同批其它 job（如回归测试）失败就取消这个 job。
    # iOS 构建是本次的核心目标，回归测试是旁路检查。
    if: always() && needs.engine.result == 'success'
    steps:
      - uses: actions/checkout@v4

      # 注意：这里**不再**下载 coomi-i686。
      # 引擎现在是 in-process 静态库（由 engine job 产出 libcoomi_ui.a），
      # 不是 iSH 里的 i686 ELF；Resources 里只需前端产物与 rootfs。
      - name: 准备资源
        run: |
          mkdir -p apps/ios/CoomiApp/Resources
          ls -la apps/ios/CoomiApp/Resources

      - name: 构建前端并放入 Resources
        # WebView 加载的是引擎进程内提供的页面（http://127.0.0.1:<port>），
        # 前端产物必须打进 App —— 运行时由 Swift 侧同步到 home/web。
        run: |
          cd apps/web
          npm ci --prefer-offline --no-audit --no-fund
          npx vite build
          ls -la dist | head -10
          mkdir -p ../ios/CoomiApp/Resources/web
          cp -R dist/. ../ios/CoomiApp/Resources/web/
          echo "前端文件数: $(find ../ios/CoomiApp/Resources/web -type f | wc -l)"

      - name: 准备 iSH rootfs（Alpine aarch64）
        # iSH 需要一个 Linux 用户态才能跑 sh/git/python —— 引擎本身不需要它。
        # 这里只做「有就打包、没有就跳过」：rootfs 缺失时 App 仍能启动并对话，
        # 只是 AI 不能执行 shell 命令，不该因为这一步让整个构建失败。
        continue-on-error: true
        run: |
          chmod +x scripts/runtime-v2/build-rootfs-alpine-ish.sh
          if ./scripts/runtime-v2/build-rootfs-alpine-ish.sh; then
            ls -la apps/ios/CoomiApp/Resources/linux-rootfs.tar.gz
            # 明确写出测试目的，免得「看起来成功但文件不存在」被忽略。
            test -s apps/ios/CoomiApp/Resources/linux-rootfs.tar.gz \
              || echo "::warning::rootfs 脚本返回成功但产物为空"
          else
            echo "::warning::rootfs 构建失败，App 将不含 Linux 工作环境"
          fi

      - name: 确认资源清单
        # 打包前把 Resources 里到底有什么打出来。
        # rootfs 是可选件，但「以为打进去了其实没有」必须能从日志一眼看出。
        run: |
          echo "=== Resources 树 ==="
          find apps/ios/CoomiApp/Resources -maxdepth 2 -type f | head -30
          echo "=== 前端文件数 ==="
          find apps/ios/CoomiApp/Resources/web -type f 2>/dev/null | wc -l
          echo "=== rootfs ==="
          ls -la apps/ios/CoomiApp/Resources/linux-rootfs.tar.gz 2>/dev/null || echo "（无 rootfs，属可接受）"

      - name: 下载原生引擎静态库
        # 引擎在独立 job（macos-15）上编译，产物要显式下载过来 ——
        # 两个 job 在不同 runner 上，本地 target 目录不存在。
        uses: actions/download-artifact@v4
        with:
          name: libcoomi_ui-ios
          path: apps/ios/ThirdParty/engine

      - name: 校验静态库
        run: |
          LIB=apps/ios/ThirdParty/engine/libcoomi_ui.a
          if [ ! -f "$LIB" ]; then
            echo "::error::找不到 libcoomi_ui.a"
            find apps/ios/ThirdParty -type f 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$LIB"
          file "$LIB"
          # 不要用 Xcode 自带的 nm 校验：它是 LLVM 17，读不了 Rust 1.99(LLVM 23)
          # 的 DWARF（Unknown attribute kind 102），会误报"缺符号"。
          # 用 strings 直接扫 Mach-O 字符串表，不依赖任何 nm 版本。
          strings "$LIB" | grep -E "^_?coomi_(start|port|version)$" | sort -u
          strings "$LIB" | grep -qE "^_?coomi_(start|port|version)$" \
            || { echo "::error::静态库缺少 coomi_* 符号"; exit 1; }
          echo "✅ 静态库符号校验通过"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: cd apps/ios && xcodegen generate

      - name: 编译
        # 不要用 `xcodebuild | tail`：管道退出码取的是 tail，
        # xcodebuild 失败会被吞成成功，后面打包步骤再报一个无关的错。
        # 这里先落日志、单独判退出码，失败时打末尾 120 行进日志。
        # GitHub Actions 用 `bash -e` 跑 run:，命令失败会立即退出，
        # 导致 `status=$?` 和 `tail` 都不执行 —— 日志里只剩 exit code。
        # 必须显式关掉 errexit，自己接管退出码，才能看到真正的编译错误。
        run: |
          set +e
          set -o pipefail
          cd apps/ios
          xcodebuild -project CoomiIOS.xcodeproj -scheme CoomiIOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > xcodebuild.log 2>&1
          status=$?
          echo "=== xcodebuild exit: $status ==="
          # 优先打印 error 行；没有就打印末尾，避免刷屏。
          if grep -q "error:" xcodebuild.log; then
            echo "=== 编译错误 ==="
            grep -n "error:" xcodebuild.log | head -40
          fi
          echo "=== 末尾 80 行 ==="
          tail -80 xcodebuild.log
          if [ $status -ne 0 ]; then
            echo "::error::xcodebuild 失败（exit $status）"
            exit $status
          fi

      - name: 上传编译日志（即使失败也留证据）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/ios/xcodebuild.log
          if-no-files-found: warn

      - name: 打包 ipa
        run: |
          set -euo pipefail
          cd apps/ios
          APP=$(find build -name "CoomiIOS.app" -maxdepth 8 | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 CoomiIOS.app —— 编译步骤没产出产物"
            find build -maxdepth 4 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "app: $APP"
          mkdir -p out/Payload
          rm -rf out/Payload/CoomiIOS.app
          cp -R "$APP" out/Payload/
          # 未签名 ipa 只是 zip 结构：Payload/<App>.app
          ( cd out && rm -f CoomiIOS-unsigned.ipa && zip -qry CoomiIOS-unsigned.ipa Payload )
          ls -la out/
          unzip -l out/CoomiIOS-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: CoomiIOS-unsigned
          path: apps/ios/out/CoomiIOS-unsigned.ipa
          if-no-files-found: error

  # ───────────────── 3.5 产物验证（自动化验收）─────────────────
  # 这一步存在的意义：前面每一步都可能"显示 success 但产物不对"
  # （已经踩过两次：bsdtar 参数不兼容、busybox 校验正则错）。
  # 所以不再靠人眼看日志，而是下载刚产出的 IPA 逐项断言。
  verify:
    name: 验证 IPA 产物
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载刚构建的 IPA
        uses: actions/download-artifact@v4
        with:
          name: CoomiIOS-unsigned
          path: apps/ios/out

      - name: 跑验证器（31 项断言）
        run: |
          ls -la apps/ios/out/
          node apps/ios/scripts/verify-ipa.cjs apps/ios/out/CoomiIOS-unsigned.ipa

  # ───────────────── 4. Rust / 前端回归 ─────────────────
  test:
    name: rust + web tests
    runs-on: ubuntu-24.04
    # 回归测试失败只说明代码有问题，不该让整个 run 判失败 ——
    # 否则 GitHub 会��消还在排队/运行的 iOS 构建。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust 测试（串行）
        run: |
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-engine
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-services
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-tools
          cargo test --manifest-path apps/coomi-rs/Cargo.toml -p coomi-ui --lib

      - name: 前端
        run: |
          cd apps/web
          npm ci
          npx vue-tsc --noEmit
          npx vite build
          node --test tests/frontendAudit.test.ts
