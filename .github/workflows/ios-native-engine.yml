# iOS 原生引擎构建（验证 aarch64-apple-ios 能否编过）
#
# 目的：引擎**原生**编译成静态库，跟随 App 启动 —— 不经 iSH 模拟。
# iSH 只作为「工作环境」（proth 的替代），提供 shell/git/python。
#
# 这个 workflow 单独存在，是为了把「Rust 能否编到 iOS」这件事
# 与其它构建分离，失败时归因最清晰（不需要在一堆 job 里找）。
name: ios-native-engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/coomi-rs/**'
      - '.github/workflows/ios-native-engine.yml'

jobs:
  build:
    name: cargo build --target aarch64-apple-ios
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust + iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
          xcodebuild -version
          # clang 由 Xcode 提供，ring 的 C 代码需要它。
          clang --version | head -3

      - name: 构建静态库（不给 iroh：它需要额外的 QUIC 依赖，先验证主干）
        run: |
          set -o pipefail
          cargo build --release \
            -p coomi-ui \
            --target aarch64-apple-ios \
            --manifest-path apps/coomi-rs/Cargo.toml \
            2>&1 | tail -60

      - name: 自检产物
        run: |
          set -o pipefail
          LIB=apps/coomi-rs/target/aarch64-apple-ios/release/libcoomi_ui.a
          ls -la "$LIB"
          file "$LIB"
          # 必须是 arm64 静态库
          file "$LIB" | grep -qi "arm64\|aarch64" || { echo "::error::不是 arm64 产物"; exit 1; }

          # C ABI 符号必须在（Swift 靠它们启动引擎）。
          # 不能用 macOS 自带 nm：rustc 1.99 带 LLVM 23 的 DWARF，
          # Xcode 16.4 的 cctools nm 只认到 LLVM 17，会报
          # "Unknown attribute kind (102)"。用与 rustc 同代的 llvm-nm。
          rustup component add llvm-tools-preview
          LLVM_NM="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-nm"
          test -x "$LLVM_NM" || LLVM_NM="$(rustup which --component llvm-tools-preview llvm-nm 2>/dev/null)" || true

          ok=1
          for sym in coomi_start coomi_port coomi_version; do
            # 判据一：llvm-nm 能读到符号表
            if [ -x "$LLVM_NM" ] && "$LLVM_NM" "$LIB" 2>/dev/null | grep -qw "$sym"; then
              echo "✅ llvm-nm: $sym"
            # 判据二：纯字节搜索（符号名一定在字符串表里）
            elif strings -a "$LIB" | grep -qx "_$sym"; then
              echo "✅ strings: _$sym"
            else
              echo "::error::缺少 C ABI 符号 $sym（检查 #[unsafe(no_mangle)]）"
              ok=0
            fi
          done
          [ "$ok" = 1 ] || exit 1
          echo "✅ 静态库自检通过"

      - uses: actions/upload-artifact@v4
        with:
          name: libcoomi_ui-ios
          path: apps/coomi-rs/target/aarch64-apple-ios/release/libcoomi_ui.a
          if-no-files-found: error
